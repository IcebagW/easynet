name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  release:
    types: [published]

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            binary: build/easynet
          - os: macos-latest
            binary: build/easynet
          - os: windows-latest
            binary: build/Release/easynet.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: easynet-${{ matrix.os }}
          path: ${{ matrix.binary }}

  release:
    if: github.event_name == 'release'
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
      - name: Upload to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p dist
          for dir in easynet-*/; do
            os=$(echo "$dir" | sed 's/^easynet-//;s/\/$//')
            ext=""
            [[ "$os" == *"windows"* ]] && ext=".exe"
            cp "$dir/easynet${ext}" "dist/easynet-${os}${ext}"
            gh release upload ${{ github.event.release.tag_name }} "dist/easynet-${os}${ext}"
          done
